[project]
name = "uvr"
version = "0.1.32"
description = "Simple script execution with uv - run Python scripts without explicit --project flag"
readme = "README.md"
authors = [
    { name = "Authors (see git history)" }
]
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }
keywords = ["uv", "script", "runner", "python", "tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Oorteo/uvr"
Repository = "https://github.com/Oorteo/uvr.git"
Issues = "https://github.com/Oorteo/uvr/issues"


[project.gui-scripts]
uvr = "uvr:main"

[project.scripts]
uvr-cli = "uvr:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
]
